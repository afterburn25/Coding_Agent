name: Chat Nexus Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build dogfood source archive
        if: github.event_name != 'pull_request'
        run: git archive --format=zip --output=chat-nexus-v0.6-dogfood.zip HEAD

      - name: Upload dogfood source archive
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: chat-nexus-v0.6-dogfood
          path: chat-nexus-v0.6-dogfood.zip
          if-no-files-found: error
          retention-days: 14

  windows-desktop:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install desktop build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.22.3 pywebview==6.2.1 pillow

      - name: Build native Chat Nexus desktop app
        shell: pwsh
        run: ./packaging/build_windows.ps1

      - name: Write build metadata
        shell: pwsh
        run: |
          @"
          Chat Nexus v0.6.0-dev
          Commit: ${{ github.sha }}
          Native desktop: pywebview / Windows WebView2
          Bundled inference runtime: llama.cpp b11278 Vulkan x64
          "@ | Set-Content -Encoding UTF8 dist/ChatNexus/BUILD_INFO.txt

      - name: Package Windows desktop app
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/ChatNexus/Source/.git")) { throw "Bundled Source workspace is missing .git metadata" }
          tar.exe -a -c -f Chat-Nexus-v0.6.0-dev-Windows-x64.zip -C dist/ChatNexus .
          $Listing = tar.exe -tf Chat-Nexus-v0.6.0-dev-Windows-x64.zip
          if (-not ($Listing -match "Source/.git/HEAD")) { throw "Packaged desktop ZIP dropped Source/.git metadata" }

      - name: Upload Windows desktop app
        uses: actions/upload-artifact@v4
        with:
          name: Chat-Nexus-v0.6.0-dev-Windows-x64
          path: Chat-Nexus-v0.6.0-dev-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
