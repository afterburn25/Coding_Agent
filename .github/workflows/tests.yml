name: Nexus Core Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check "cryptography==50.0.1" "numpy==2.3.5"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Resolve canonical version
        if: github.event_name != 'pull_request'
        run: echo "APP_VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Build dogfood source archive
        if: github.event_name != 'pull_request'
        run: git archive --format=zip --output="chat-nexus-v${APP_VERSION}-dogfood.zip" HEAD

      - name: Upload dogfood source archive
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: chat-nexus-v${{ env.APP_VERSION }}-dogfood
          path: chat-nexus-v${{ env.APP_VERSION }}-dogfood.zip
          if-no-files-found: error
          retention-days: 14

  windows-desktop:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.424"

      - name: Run splash progress model tests
        shell: pwsh
        run: dotnet run -c Release --project desktop/StartupProgress.Tests

      - name: Resolve canonical version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $numeric = ($version -split '-')[0]
          while (($numeric -split '\.').Count -lt 4) { $numeric += ".0" }
          Add-Content -Path $env:GITHUB_ENV -Value "APP_VERSION=$version"
          Add-Content -Path $env:GITHUB_ENV -Value "APP_NUMERIC_VERSION=$numeric"
          Write-Host "Resolved canonical version: $version (numeric $numeric)"

      - name: Install desktop build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.22.3 pillow==12.3.0 cryptography==50.0.1 py7zr==1.1.3

      - name: Install Inno Setup
        shell: pwsh
        # Runner images may already ship a newer Inno — a pinned downgrade
        # fails under choco. Use the preinstalled ISCC when present; only
        # install when absent.
        run: |
          $Iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $LocalIscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          if ((Test-Path $Iscc) -or (Test-Path $LocalIscc) -or
              (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            Write-Host "Inno Setup already present — skipping choco install."
          } else {
            choco install innosetup --yes --no-progress
          }

      - name: Build native Nexus Core desktop app
        shell: pwsh
        run: ./packaging/build_windows.ps1

      - name: Write build metadata
        shell: pwsh
        run: |
          @"
          Nexus Core v$env:APP_VERSION
          Commit: ${{ github.sha }}
          Native desktop: .NET 8 WinForms / Microsoft WebView2
          Bundled inference runtime: llama.cpp Vulkan x64
          Installer: Inno Setup LZMA2 update-aware bootstrap with verified coding-model downloads (tools install in-app)
          "@ | Set-Content -Encoding UTF8 dist/ChatNexus/BUILD_INFO.txt

      - name: Prepare code-signing certificate (optional)
        shell: pwsh
        env:
          NEXUS_CODESIGN_PFX_B64: ${{ secrets.NEXUS_CODESIGN_PFX_B64 }}
          NEXUS_CODESIGN_PASSWORD: ${{ secrets.NEXUS_CODESIGN_PASSWORD }}
          NEXUS_CODESIGN_THUMBPRINT: ${{ secrets.NEXUS_CODESIGN_THUMBPRINT }}
        run: |
          # Signing is optional: without secrets the build ships unsigned, which
          # is what SmartScreen/Defender flags. Provide either a base64-encoded
          # PFX (+ password) or a thumbprint for a cert already in the store.
          if ($env:NEXUS_CODESIGN_PFX_B64) {
            $PfxPath = Join-Path $env:RUNNER_TEMP "nexus-codesign.pfx"
            [IO.File]::WriteAllBytes($PfxPath, [Convert]::FromBase64String($env:NEXUS_CODESIGN_PFX_B64))
            Add-Content -Path $env:GITHUB_ENV -Value "NEXUS_CODESIGN_PFX=$PfxPath"
            Write-Host "Code-signing PFX materialized (path recorded in env)."
          } elseif ($env:NEXUS_CODESIGN_THUMBPRINT) {
            Write-Host "Code-signing via certificate thumbprint."
          } else {
            Write-Host "No signing secrets configured — build will be unsigned."
          }

      - name: Build single-file Nexus Core installer
        shell: pwsh
        run: |
          $Iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $Iscc)) {
            $Iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $Iscc)) {
            $Iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source
          }
          $IssArgs = @("/DAppVersion=$env:APP_VERSION", "/DAppNumericVersion=$env:APP_NUMERIC_VERSION")
          $SignTool = $null
          $KitsBin = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          if (Test-Path $KitsBin) {
            $SignTool = Get-ChildItem $KitsBin -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like "*x64*" } | Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $SignTool) {
            $SignToolCmd = Get-Command signtool.exe -ErrorAction SilentlyContinue
            if ($SignToolCmd) { $SignTool = $SignToolCmd.Source }
          }
          $CertPart = $null
          if ($env:NEXUS_CODESIGN_THUMBPRINT) {
            $CertPart = "/sha1 $($env:NEXUS_CODESIGN_THUMBPRINT)"
          } elseif ($env:NEXUS_CODESIGN_PFX -and (Test-Path $env:NEXUS_CODESIGN_PFX)) {
            $CertPart = "/f `"$($env:NEXUS_CODESIGN_PFX)`""
            if ($env:NEXUS_CODESIGN_PASSWORD) { $CertPart += " /p `"$($env:NEXUS_CODESIGN_PASSWORD)`"" }
          }
          if ($SignTool -and $CertPart) {
            $IssArgs += "/DWithSign"
            $IssArgs += "/Sstandard=`"$SignTool`" sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 $CertPart `$f"
          }
          & $Iscc @IssArgs "installer\ChatNexus.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          $Setup = "dist\installer\NexusCore-Setup-${env:APP_VERSION}-Windows-x64.exe"
          if (-not (Test-Path $Setup)) { throw "Installer EXE was not produced" }
          # With /DWithSign, Inno's SignTool=standard already signed the setup
          # EXE and the embedded uninstaller during compilation.

      - name: Generate artifact checksums
        shell: pwsh
        run: |
          $Setup = "dist\installer\NexusCore-Setup-${env:APP_VERSION}-Windows-x64.exe"
          $Hash = (Get-FileHash -Algorithm SHA256 $Setup).Hash.ToLowerInvariant()
          "$Hash  NexusCore-Setup-${env:APP_VERSION}-Windows-x64.exe" |
            Set-Content -Encoding ASCII "dist\installer\NexusCore-Setup-${env:APP_VERSION}-Windows-x64.exe.sha256"
          $Sig = & {
            try { (Get-AuthenticodeSignature $Setup).Status.ToString() } catch { "Unknown" }
          }
          @"
          Nexus Core installer
          Commit: ${{ github.sha }}
          SHA-256: $Hash
          Authenticode: $Sig
          Verify on Windows:  Get-FileHash .\NexusCore-Setup-${env:APP_VERSION}-Windows-x64.exe
          "@ | Set-Content -Encoding UTF8 "dist\installer\CHECKSUMS.txt"
          Write-Host "Installer SHA-256: $Hash (signature: $Sig)"

      - name: Smoke-test fresh install and update preservation
        shell: pwsh
        run: |
          function Invoke-WithTimeout {
            param(
              [string]$FilePath,
              [string[]]$ArgumentList,
              [string]$WorkingDirectory = "",
              [int]$TimeoutSeconds = 180
            )
            $Start = @{
              FilePath = $FilePath
              ArgumentList = $ArgumentList
              PassThru = $true
            }
            if ($WorkingDirectory) { $Start.WorkingDirectory = $WorkingDirectory }
            $Process = Start-Process @Start
            try {
              Wait-Process -Id $Process.Id -Timeout $TimeoutSeconds -ErrorAction Stop
            } catch {
              try { Stop-Process -Id $Process.Id -Force -ErrorAction SilentlyContinue } catch {}
              throw "$FilePath timed out after $TimeoutSeconds seconds"
            }
            $Process.Refresh()
            return $Process.ExitCode
          }

          $Setup = (Resolve-Path "dist\installer\NexusCore-Setup-${env:APP_VERSION}-Windows-x64.exe").Path
          $InstallDir = Join-Path $env:RUNNER_TEMP "Nexus Core Installer Test"

          # Skip multi-gigabyte public model downloads only in CI smoke tests.
          # Normal interactive installers keep the bootstrap downloads enabled.
          $env:CHAT_NEXUS_SKIP_MODEL_DOWNLOADS = "1"

          $FirstExit = Invoke-WithTimeout -FilePath $Setup -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/DIR=`"$InstallDir`""
          ) -TimeoutSeconds 180
          if ($FirstExit -ne 0) { throw "Fresh installer run failed with exit code $FirstExit" }

          $App = Join-Path $InstallDir "NexusCore.exe"
          if (-not (Test-Path $App)) { throw "Installed NexusCore.exe is missing" }
          if (-not (Test-Path (Join-Path $InstallDir "backend\ChatNexus.Backend.exe"))) { throw "Installed backend is missing" }
          if (-not (Test-Path (Join-Path $InstallDir "runtime\llama\llama-server.exe"))) { throw "Installed llama.cpp runtime is missing" }
          if (-not (Test-Path (Join-Path $InstallDir "Source\.git\HEAD"))) { throw "Installed Source Git workspace is missing" }
          if (-not (Test-Path (Join-Path $InstallDir "Source\localcodeagent\server.py"))) { throw "Installed Source workspace is incomplete" }
          if (-not (Test-Path (Join-Path $InstallDir "config.json"))) { throw "Installer did not seed config.json" }
          $BundledWorkflows = @(
            "workflows\ask_workspace.json",
            "workflows\clip_transcribe.json",
            "workflows\image\qwen\qwen-image-2.1-t2i-api.json",
            "workflows\image\qwen\qwen-image-2.1-edit-api.json",
            "workflows\image\qwen\qwen-image-2.1-inpaint-api.json",
            "workflows\image\qwen\qwen-image-2.1-background-removal-api.json",
            "workflows\image\flux\flux2-klein-4b-t2i-api.json",
            "workflows\image\flux\flux2-klein-4b-edit-api.json",
            "workflows\image\upscalers\realesrgan-x4plus-api.json"
          )
          foreach ($RelativeWorkflow in $BundledWorkflows) {
            if (-not (Test-Path (Join-Path $InstallDir $RelativeWorkflow))) {
              throw "Installer did not seed bundled image workflow: $RelativeWorkflow"
            }
          }

          $SmokeExit = Invoke-WithTimeout -FilePath $App -ArgumentList @("--self-test") -WorkingDirectory $InstallDir -TimeoutSeconds 90
          if ($SmokeExit -ne 0) { throw "Installed NexusCore.exe self-test failed with exit code $SmokeExit" }

          New-Item -ItemType Directory -Force -Path (Join-Path $InstallDir "models") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $InstallDir "data") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $InstallDir "workflows\image") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $InstallDir "Source\.agent") | Out-Null
          Set-Content -Encoding UTF8 (Join-Path $InstallDir "models\UPGRADE_PRESERVE.marker") "keep-models"
          Set-Content -Encoding UTF8 (Join-Path $InstallDir "data\UPGRADE_PRESERVE.marker") "keep-data"
          Set-Content -Encoding UTF8 (Join-Path $InstallDir "workflows\image\UPGRADE_PRESERVE.marker") "keep-workflows"
          Set-Content -Encoding UTF8 (Join-Path $InstallDir "Source\UPGRADE_PRESERVE.marker") "keep-source"
          Set-Content -Encoding UTF8 (Join-Path $InstallDir "Source\.agent\UPGRADE_PRESERVE.marker") "keep-task-state"

          $ConfigPath = Join-Path $InstallDir "config.json"
          $Config = Get-Content -Raw $ConfigPath | ConvertFrom-Json
          $Config | Add-Member -NotePropertyName "upgrade_preserve_marker" -NotePropertyValue "keep-config" -Force
          $Config | ConvertTo-Json -Depth 100 | Set-Content -Encoding UTF8 $ConfigPath

          # Fake Nexus Core Process: prove the Update path can close a running
          # process tree itself instead of relying on Inno Restart Manager.
          $FakeDir = Join-Path $env:RUNNER_TEMP "Fake Nexus Core Process"
          New-Item -ItemType Directory -Force -Path $FakeDir | Out-Null
          $FakeExe = Join-Path $FakeDir "NexusCore.exe"
          Copy-Item "$env:SystemRoot\System32\cmd.exe" $FakeExe -Force
          $FakeApp = Start-Process -FilePath $FakeExe -ArgumentList @(
            "/c",
            "ping",
            "127.0.0.1",
            "-t"
          ) -PassThru
          Start-Sleep -Seconds 1
          $FakeApp.Refresh()
          if ($FakeApp.HasExited) { throw "Fake NexusCore.exe process did not stay running for update-close smoke test" }

          # Simulate a pre-rebrand Chat Nexus install: the legacy exe name
          # plus a running legacy process must both be cleaned by the update.
          Copy-Item $App (Join-Path $InstallDir "ChatNexus.exe") -Force
          $FakeLegacyExe = Join-Path $FakeDir "ChatNexus.exe"
          Copy-Item "$env:SystemRoot\System32\cmd.exe" $FakeLegacyExe -Force
          $FakeLegacy = Start-Process -FilePath $FakeLegacyExe -ArgumentList @("/c", "ping", "127.0.0.1", "-t") -PassThru
          Start-Sleep -Seconds 1

          # The second run intentionally omits /DIR. The stable AppId and
          # UsePreviousAppDir must rediscover the existing installation.
          $UpdateExit = Invoke-WithTimeout -FilePath $Setup -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART"
          ) -TimeoutSeconds 180
          if ($UpdateExit -ne 0) { throw "Update installer run failed with exit code $UpdateExit" }

          $FakeApp.Refresh()
          if (-not $FakeApp.HasExited) {
            try { Stop-Process -Id $FakeApp.Id -Force -ErrorAction SilentlyContinue } catch {}
            throw "Installer did not close the running NexusCore.exe process"
          }
          $FakeLegacy.Refresh()
          if (-not $FakeLegacy.HasExited) {
            try { Stop-Process -Id $FakeLegacy.Id -Force -ErrorAction SilentlyContinue } catch {}
            throw "Installer did not close the running legacy ChatNexus.exe process"
          }
          if (Test-Path (Join-Path $InstallDir "ChatNexus.exe")) { throw "Update left the legacy ChatNexus.exe behind" }

          if (-not (Test-Path (Join-Path $InstallDir "models\UPGRADE_PRESERVE.marker"))) { throw "Update removed downloaded model state" }
          if (-not (Test-Path (Join-Path $InstallDir "data\UPGRADE_PRESERVE.marker"))) { throw "Update removed application data" }
          if (-not (Test-Path (Join-Path $InstallDir "workflows\image\UPGRADE_PRESERVE.marker"))) { throw "Update removed imported workflows" }
          if (-not (Test-Path (Join-Path $InstallDir "Source\UPGRADE_PRESERVE.marker"))) { throw "Update overwrote the Source workspace" }
          if (-not (Test-Path (Join-Path $InstallDir "Source\.agent\UPGRADE_PRESERVE.marker"))) { throw "Update removed task/project state" }

          $ConfigAfter = Get-Content -Raw $ConfigPath | ConvertFrom-Json
          if ($ConfigAfter.upgrade_preserve_marker -ne "keep-config") { throw "Update overwrote config.json" }

          $SmokeAfterExit = Invoke-WithTimeout -FilePath $App -ArgumentList @("--self-test") -WorkingDirectory $InstallDir -TimeoutSeconds 90
          if ($SmokeAfterExit -ne 0) { throw "Updated NexusCore.exe self-test failed with exit code $SmokeAfterExit" }

      - name: Upload Nexus Core installer
        uses: actions/upload-artifact@v4
        with:
          name: NexusCore-Setup-${{ env.APP_VERSION }}-Windows-x64
          path: |
            dist/installer/NexusCore-Setup-${{ env.APP_VERSION }}-Windows-x64.exe
            dist/installer/NexusCore-Setup-${{ env.APP_VERSION }}-Windows-x64.exe.sha256
            dist/installer/CHECKSUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Package Windows desktop app
        shell: pwsh
        run: |
          python packaging/make_windows_zip.py dist/ChatNexus NexusCore-v${env:APP_VERSION}-Windows-x64.zip
          $Hash = (Get-FileHash -Algorithm SHA256 "NexusCore-v${env:APP_VERSION}-Windows-x64.zip").Hash.ToLowerInvariant()
          "$Hash  NexusCore-v${env:APP_VERSION}-Windows-x64.zip" |
            Set-Content -Encoding ASCII "NexusCore-v${env:APP_VERSION}-Windows-x64.zip.sha256"

      - name: Upload Windows desktop app
        uses: actions/upload-artifact@v4
        with:
          name: NexusCore-v${{ env.APP_VERSION }}-Windows-x64
          path: |
            NexusCore-v${{ env.APP_VERSION }}-Windows-x64.zip
            NexusCore-v${{ env.APP_VERSION }}-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
