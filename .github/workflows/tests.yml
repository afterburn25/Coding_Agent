name: Chat Nexus Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build dogfood source archive
        if: github.event_name != 'pull_request'
        run: git archive --format=zip --output=chat-nexus-v0.6-dogfood.zip HEAD

      - name: Upload dogfood source archive
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: chat-nexus-v0.6-dogfood
          path: chat-nexus-v0.6-dogfood.zip
          if-no-files-found: error
          retention-days: 14

  windows-desktop:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install desktop build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.22.3 pillow

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build native Chat Nexus desktop app
        shell: pwsh
        run: ./packaging/build_windows.ps1

      - name: Write build metadata
        shell: pwsh
        run: |
          @"
          Chat Nexus v0.6.0-dev
          Commit: ${{ github.sha }}
          Native desktop: .NET 8 WinForms / Microsoft WebView2
          Bundled inference runtime: llama.cpp b11278 Vulkan x64
          Installer: Inno Setup LZMA2 update-aware bootstrap with verified coding + ComfyUI/image-stack downloads
          "@ | Set-Content -Encoding UTF8 dist/ChatNexus/BUILD_INFO.txt

      - name: Build single-file Chat Nexus installer
        shell: pwsh
        run: |
          $Iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $Iscc)) {
            $Iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source
          }
          & $Iscc "/DAppVersion=0.6.0-dev" "/DAppNumericVersion=0.6.0.0" "installer\ChatNexus.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          $Setup = "dist\installer\Chat-Nexus-Setup-0.6.0-dev-Windows-x64.exe"
          if (-not (Test-Path $Setup)) { throw "Installer EXE was not produced" }

      - name: Smoke-test fresh install and update preservation
        shell: pwsh
        run: |
          function Invoke-WithTimeout {
            param(
              [string]$FilePath,
              [string[]]$ArgumentList,
              [string]$WorkingDirectory = "",
              [int]$TimeoutSeconds = 180
            )
            $Start = @{
              FilePath = $FilePath
              ArgumentList = $ArgumentList
              PassThru = $true
            }
            if ($WorkingDirectory) { $Start.WorkingDirectory = $WorkingDirectory }
            $Process = Start-Process @Start
            try {
              Wait-Process -Id $Process.Id -Timeout $TimeoutSeconds -ErrorAction Stop
            } catch {
              try { Stop-Process -Id $Process.Id -Force -ErrorAction SilentlyContinue } catch {}
              throw "$FilePath timed out after $TimeoutSeconds seconds"
            }
            $Process.Refresh()
            return $Process.ExitCode
          }

          $Setup = (Resolve-Path "dist\installer\Chat-Nexus-Setup-0.6.0-dev-Windows-x64.exe").Path
          $InstallDir = Join-Path $env:RUNNER_TEMP "Chat Nexus Installer Test"

          # Skip multi-gigabyte public model downloads only in CI smoke tests.
          # Normal interactive installers keep the bootstrap downloads enabled.
          $env:CHAT_NEXUS_SKIP_MODEL_DOWNLOADS = "1"

          $FirstExit = Invoke-WithTimeout -FilePath $Setup -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/DIR=`"$InstallDir`""
          ) -TimeoutSeconds 180
          if ($FirstExit -ne 0) { throw "Fresh installer run failed with exit code $FirstExit" }

          $App = Join-Path $InstallDir "ChatNexus.exe"
          if (-not (Test-Path $App)) { throw "Installed ChatNexus.exe is missing" }
          if (-not (Test-Path (Join-Path $InstallDir "backend\ChatNexus.Backend.exe"))) { throw "Installed backend is missing" }
          if (-not (Test-Path (Join-Path $InstallDir "runtime\llama\llama-server.exe"))) { throw "Installed llama.cpp runtime is missing" }
          if (-not (Test-Path (Join-Path $InstallDir "Source\.git\HEAD"))) { throw "Installed Source Git workspace is missing" }
          if (-not (Test-Path (Join-Path $InstallDir "Source\localcodeagent\server.py"))) { throw "Installed Source workspace is incomplete" }
          if (-not (Test-Path (Join-Path $InstallDir "config.json"))) { throw "Installer did not seed config.json" }
          $BundledImageWorkflows = @(
            "workflows\image\qwen\qwen-image-2.1-t2i-api.json",
            "workflows\image\qwen\qwen-image-2.1-edit-api.json",
            "workflows\image\qwen\qwen-image-2.1-inpaint-api.json",
            "workflows\image\qwen\qwen-image-2.1-background-removal-api.json",
            "workflows\image\flux\flux2-klein-4b-t2i-api.json",
            "workflows\image\flux\flux2-klein-4b-edit-api.json"
          )
          foreach ($RelativeWorkflow in $BundledImageWorkflows) {
            if (-not (Test-Path (Join-Path $InstallDir $RelativeWorkflow))) {
              throw "Installer did not seed bundled image workflow: $RelativeWorkflow"
            }
          }

          $SmokeExit = Invoke-WithTimeout -FilePath $App -ArgumentList @("--self-test") -WorkingDirectory $InstallDir -TimeoutSeconds 90
          if ($SmokeExit -ne 0) { throw "Installed ChatNexus.exe self-test failed with exit code $SmokeExit" }

          New-Item -ItemType Directory -Force -Path (Join-Path $InstallDir "models") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $InstallDir "data") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $InstallDir "workflows\image") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $InstallDir "Source\.agent") | Out-Null
          Set-Content -Encoding UTF8 (Join-Path $InstallDir "models\UPGRADE_PRESERVE.marker") "keep-models"
          Set-Content -Encoding UTF8 (Join-Path $InstallDir "data\UPGRADE_PRESERVE.marker") "keep-data"
          Set-Content -Encoding UTF8 (Join-Path $InstallDir "workflows\image\UPGRADE_PRESERVE.marker") "keep-workflows"
          Set-Content -Encoding UTF8 (Join-Path $InstallDir "Source\UPGRADE_PRESERVE.marker") "keep-source"
          Set-Content -Encoding UTF8 (Join-Path $InstallDir "Source\.agent\UPGRADE_PRESERVE.marker") "keep-task-state"

          $ConfigPath = Join-Path $InstallDir "config.json"
          $Config = Get-Content -Raw $ConfigPath | ConvertFrom-Json
          $Config | Add-Member -NotePropertyName "upgrade_preserve_marker" -NotePropertyValue "keep-config" -Force
          $Config | ConvertTo-Json -Depth 100 | Set-Content -Encoding UTF8 $ConfigPath

          # Fake Chat Nexus Process: prove the Update path can close a running
          # process tree itself instead of relying on Inno Restart Manager.
          $FakeDir = Join-Path $env:RUNNER_TEMP "Fake Chat Nexus Process"
          New-Item -ItemType Directory -Force -Path $FakeDir | Out-Null
          $FakeExe = Join-Path $FakeDir "ChatNexus.exe"
          Copy-Item "$env:SystemRoot\System32\cmd.exe" $FakeExe -Force
          $FakeChatNexus = Start-Process -FilePath $FakeExe -ArgumentList @(
            "/c",
            "ping",
            "127.0.0.1",
            "-t"
          ) -PassThru
          Start-Sleep -Seconds 1
          $FakeChatNexus.Refresh()
          if ($FakeChatNexus.HasExited) { throw "Fake ChatNexus.exe process did not stay running for update-close smoke test" }

          # The second run intentionally omits /DIR. The stable AppId and
          # UsePreviousAppDir must rediscover the existing installation.
          $UpdateExit = Invoke-WithTimeout -FilePath $Setup -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART"
          ) -TimeoutSeconds 180
          if ($UpdateExit -ne 0) { throw "Update installer run failed with exit code $UpdateExit" }

          $FakeChatNexus.Refresh()
          if (-not $FakeChatNexus.HasExited) {
            try { Stop-Process -Id $FakeChatNexus.Id -Force -ErrorAction SilentlyContinue } catch {}
            throw "Installer did not close the running ChatNexus.exe process"
          }

          if (-not (Test-Path (Join-Path $InstallDir "models\UPGRADE_PRESERVE.marker"))) { throw "Update removed downloaded model state" }
          if (-not (Test-Path (Join-Path $InstallDir "data\UPGRADE_PRESERVE.marker"))) { throw "Update removed application data" }
          if (-not (Test-Path (Join-Path $InstallDir "workflows\image\UPGRADE_PRESERVE.marker"))) { throw "Update removed imported workflows" }
          if (-not (Test-Path (Join-Path $InstallDir "Source\UPGRADE_PRESERVE.marker"))) { throw "Update overwrote the Source workspace" }
          if (-not (Test-Path (Join-Path $InstallDir "Source\.agent\UPGRADE_PRESERVE.marker"))) { throw "Update removed task/project state" }

          $ConfigAfter = Get-Content -Raw $ConfigPath | ConvertFrom-Json
          if ($ConfigAfter.upgrade_preserve_marker -ne "keep-config") { throw "Update overwrote config.json" }

          $SmokeAfterExit = Invoke-WithTimeout -FilePath $App -ArgumentList @("--self-test") -WorkingDirectory $InstallDir -TimeoutSeconds 90
          if ($SmokeAfterExit -ne 0) { throw "Updated ChatNexus.exe self-test failed with exit code $SmokeAfterExit" }

      - name: Upload Chat Nexus installer
        uses: actions/upload-artifact@v4
        with:
          name: Chat-Nexus-Setup-0.6.0-dev-Windows-x64
          path: dist/installer/Chat-Nexus-Setup-0.6.0-dev-Windows-x64.exe
          if-no-files-found: error
          retention-days: 14

      - name: Package Windows desktop app
        shell: pwsh
        run: python packaging/make_windows_zip.py dist/ChatNexus Chat-Nexus-v0.6.0-dev-Windows-x64.zip

      - name: Upload Windows desktop app
        uses: actions/upload-artifact@v4
        with:
          name: Chat-Nexus-v0.6.0-dev-Windows-x64
          path: Chat-Nexus-v0.6.0-dev-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
