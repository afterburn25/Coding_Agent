[project]
name = "local-code-agent"
version = "0.26.0"
description = "Chat Nexus: a local-first AI coding workstation with automatic model routing, research/browser tooling, image generation/editing, transactional workflows, and modular tools."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["cryptography==50.0.1", "py7zr==1.1.3"]

[project.optional-dependencies]
browser = ["playwright>=1.55"]
voice-stt = [
    "sounddevice==0.5.6",
    "faster-whisper==1.2.1",
    "av==18.1.0",
]
code-intel = [
    "tree-sitter==0.26.0",
    "tree-sitter-python==0.25.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "python-lsp-server==1.15.0",
]

[project.scripts]
chat-nexus = "localcodeagent.__main__:main"
local-code-agent = "localcodeagent.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["localcodeagent*"]
